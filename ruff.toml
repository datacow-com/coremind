target-version = "py311"
line-length = 100
extend-exclude = ["frontend", ".venv", "venv"]

[lint]
select = ["E","F","W","I","B","UP","S"]
ignore = ["E501"]

[lint.per-file-ignores]
"server/**" = ["B008","S110","S112","B904"]
"core/**" = ["S110","S112"]
"core/ingestion/**" = ["S314"]
"core/loaders/visual_pdf_loader.py" = ["UP038"]
"tests/**" = ["S101","S112","S108","S110"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
