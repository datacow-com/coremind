version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: omnirag
      POSTGRES_USER: omnirag
      POSTGRES_PASSWORD: omnirag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "3504:5432"
    networks:
      - omnirag_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "omnirag", "-d", "omnirag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Milvus Vector Database
  milvus:
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      ETCD_CONFIG_PATH: "/milvus/configs/embedEtcd.yaml"
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "3505:19530"
      - "3506:9091"
    networks:
      - omnirag_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - DATABASE_URL=postgresql://omnirag:omnirag_password@postgres:5432/omnirag
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
    ports:
      - "3503:8000"
    depends_on:
      - postgres
      - milvus
    volumes:
      - ./uploads:/app/uploads
    networks:
      - omnirag_network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/api/health', timeout=5).status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3502:3000"
    depends_on:
      - backend
    networks:
      - omnirag_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "3500:80"
      - "3501:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - omnirag_network
    restart: unless-stopped

volumes:
  postgres_data:
  milvus_data:

networks:
  omnirag_network:
    driver: bridge
