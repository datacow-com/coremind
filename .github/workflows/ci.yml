name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Install frontend deps
        run: |
          npm --prefix frontend ci
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/embedded-ui/package-lock.json
      - name: Install embedded-ui deps
        run: |
          npm --prefix apps/embedded-ui ci
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Python syntax compile
        run: python -m compileall -q core server
      - name: Mypy
        run: mypy --config-file mypy.ini core server
      - name: Bandit
        run: bandit -c .bandit -r core server

  type_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pydantic
      - name: Run mypy (strict on new modules)
        run: |
          mypy --config-file mypy.ini \
            core/reranker/cohere_reranker.py \
            core/vision/layout_analyzer.py \
            core/vision/yolo_detector.py \
            core/vision/layoutlm_parser.py \
            core/storage/local_index.py \
            core/storage/index_router.py \
            server/routes.py \
            server/model_gateway_routes.py

  lint_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        run: npm --prefix frontend ci
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/embedded-ui/package-lock.json
      - name: Embedded UI install
        run: npm --prefix apps/embedded-ui ci
      - name: Frontend eslint
        run: npm --prefix frontend run lint
      - name: Frontend type-check
        run: npm --prefix frontend run type-check
      - name: Frontend prettier check
        run: npm --prefix frontend run format:check
      - name: Embedded eslint
        run: npm --prefix apps/embedded-ui run lint
      - name: Embedded type-check
        run: npm --prefix apps/embedded-ui run type-check
      - name: Embedded prettier check
        run: npm --prefix apps/embedded-ui run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run key tests
        run: |
          pytest -q \
            tests/test_route_intent.py::test_route_intent_classification \
            tests/test_chat_stream.py::test_chat_stream_basic \
            tests/test_html_ingest.py::test_html_ingest_to_markdown \
            tests/test_vector_store_api.py::test_vector_collections_endpoint \
            tests/test_web_search_provider.py::test_web_search_runs \
            tests/test_usage_alerts.py::test_threshold_webhook_trigger
      - name: Coverage (core/server)
        run: |
          pytest --cov=core --cov=server --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  e2e_light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Launch backend (light mode)
        run: |
          nohup python -m uvicorn server.main:app --port 8000 &
          sleep 5
      - name: Run E2E tests (light mode)
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          pytest -q -k 'e2e'
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  e2e_docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker e2e
        run: |
          make e2e-docker

  ui_smoke_docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Launch stack
        run: docker compose up -d --wait
      - name: Playwright install deps
        run: |
          npx --prefix frontend playwright install --with-deps
      - name: Run UI smoke
        env:
          UI_BASE_URL: http://localhost:3500
        run: npm --prefix frontend run test:ui
      - name: Cleanup
        if: always()
        run: docker compose down -v
