# ═══════════════════════════════════════════════════════════════════════════════
# OmniRAG 能力清单 (Capability Manifest)
# ═══════════════════════════════════════════════════════════════════════════════
#
# 设计原则：
#   1. 不沉默 - 每个能力必须在 UI 中可见
#   2. 可选择 - 用户可以为 KB 启用/禁用能力
#   3. 可配置 - 每个能力有可调参数
#   4. 可使用 - 配置后立即生效
#
# UI 展示规则：
#   - 每个能力渲染为一张卡片
#   - 卡片包含：图标、名称、描述、状态、配置入口
#   - 分类展示：基础 → 增强 → 专业 → 高级
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0"
last_updated: "2025-12-08"

# ═══════════════════════════════════════════════════════════════════════════════
# 能力分类定义
# ═══════════════════════════════════════════════════════════════════════════════
categories:
  basic:
    name: "基础能力"
    name_en: "Basic"
    description: "文档处理基础能力，默认启用"
    icon: "cube"
    color: "#10B981" # green
    order: 1

  enhanced:
    name: "增强能力"
    name_en: "Enhanced"
    description: "提升处理质量的增强能力"
    icon: "sparkles"
    color: "#3B82F6" # blue
    order: 2

  pro:
    name: "专业能力"
    name_en: "Professional"
    description: "特定场景的专业处理能力"
    icon: "beaker"
    color: "#8B5CF6" # purple
    order: 3

  advanced:
    name: "高级能力"
    name_en: "Advanced"
    description: "知识增强与深度分析能力"
    icon: "academic-cap"
    color: "#F59E0B" # amber
    order: 4

# ═══════════════════════════════════════════════════════════════════════════════
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ 基础能力 (Basic) - 默认启用，文档处理必备                                   │
# └───────────────────────────────────────────────────────────────────────────┘
# ═══════════════════════════════════════════════════════════════════════════════
capabilities:
  # ─────────────────────────────────────────────────────────────────────────────
  # 文本提取
  # ─────────────────────────────────────────────────────────────────────────────
  text_extraction:
    id: "basic.text_extraction"
    category: "basic"

    # UI 展示
    name: "文本提取"
    name_en: "Text Extraction"
    description: "从文档中提取纯文本内容"
    description_en: "Extract plain text from documents"
    icon: "document-text"

    # 状态控制
    default_enabled: true
    user_configurable: false # 基础能力不可禁用
    always_on: true

    # 适用范围
    supported_formats:
      - pdf
      - docx
      - doc
      - pptx
      - ppt
      - txt
      - md
      - html
      - eml

    # 实现映射
    implementation:
      module: "core.ingestion.nodes.parser.cpu_parser"
      class: "CpuTextParser"

    # 无需配置
    config_schema: null

  # ─────────────────────────────────────────────────────────────────────────────
  # 文档分块
  # ─────────────────────────────────────────────────────────────────────────────
  chunking:
    id: "basic.chunking"
    category: "basic"

    name: "文档分块"
    name_en: "Document Chunking"
    description: "将长文档切分为适合检索的片段"
    description_en: "Split long documents into retrievable chunks"
    icon: "scissors"

    default_enabled: true
    user_configurable: true
    always_on: true

    implementation:
      module: "core.ingestion.nodes.chunker"
      class: "SmartChunker"

    config_schema:
      type: object
      properties:
        mode:
          type: string
          title: "分块模式"
          description: "选择分块策略"
          enum: ["fixed", "semantic", "layout_aware"]
          enum_labels:
            fixed: "固定长度"
            semantic: "语义边界"
            layout_aware: "版面感知"
          default: "fixed"
          ui_component: "select"

        chunk_size:
          type: integer
          title: "块大小"
          description: "每个块的目标字符数"
          minimum: 128
          maximum: 2048
          default: 512
          ui_component: "slider"
          ui_step: 64

        overlap:
          type: integer
          title: "重叠长度"
          description: "相邻块之间的重叠字符数"
          minimum: 0
          maximum: 200
          default: 50
          ui_component: "slider"
          ui_step: 10

  # ─────────────────────────────────────────────────────────────────────────────
  # 向量嵌入
  # ─────────────────────────────────────────────────────────────────────────────
  embedding:
    id: "basic.embedding"
    category: "basic"

    name: "向量嵌入"
    name_en: "Vector Embedding"
    description: "将文本转换为向量，用于语义检索"
    description_en: "Convert text to vectors for semantic search"
    icon: "code-bracket"

    default_enabled: true
    user_configurable: true
    always_on: true

    implementation:
      module: "core.embedding.registry"
      function: "get_embedder"

    config_schema:
      type: object
      properties:
        model:
          type: string
          title: "嵌入模型"
          description: "选择向量嵌入模型"
          enum:
            ["BAAI/bge-m3", "text-embedding-3-small", "text-embedding-3-large"]
          enum_labels:
            "BAAI/bge-m3": "BGE-M3 (推荐中文)"
            "text-embedding-3-small": "OpenAI Small"
            "text-embedding-3-large": "OpenAI Large"
          default: "BAAI/bge-m3"
          ui_component: "select"

  # ═══════════════════════════════════════════════════════════════════════════════
  # ┌───────────────────────────────────────────────────────────────────────────┐
  # │ 增强能力 (Enhanced) - 可选启用，提升处理质量                                │
  # └───────────────────────────────────────────────────────────────────────────┘
  # ═══════════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────────
  # 表格识别
  # ─────────────────────────────────────────────────────────────────────────────
  table_recognition:
    id: "enhanced.table_recognition"
    category: "enhanced"

    name: "表格识别"
    name_en: "Table Recognition"
    description: "从文档中检测并结构化表格内容"
    description_en: "Detect and structure tables from documents"
    icon: "table-cells"

    # 使用场景提示
    use_case: "适用于包含数据表格的 PDF、Word 文档"

    default_enabled: false
    user_configurable: true

    # 资源需求
    requires_gpu: true
    gpu_memory_mb: 2048

    supported_formats:
      - pdf
      - docx
      - pptx
      - image

    implementation:
      module: "core.ingestion.nodes.table_extractor"
      class: "TableExtractor"

    config_schema:
      type: object
      properties:
        model:
          type: string
          title: "识别模型"
          description: "选择表格识别模型"
          enum: ["table_transformer", "pp_structure", "camelot"]
          enum_labels:
            table_transformer: "TableTransformer (高精度)"
            pp_structure: "PP-Structure (快速)"
            camelot: "Camelot (PDF专用)"
          default: "table_transformer"
          ui_component: "select"

        output_format:
          type: string
          title: "输出格式"
          description: "表格导出格式"
          enum: ["markdown", "csv", "json", "html"]
          enum_labels:
            markdown: "Markdown 表格"
            csv: "CSV 格式"
            json: "JSON 结构化"
            html: "HTML 表格"
          default: "markdown"
          ui_component: "select"

        merge_cells:
          type: boolean
          title: "合并单元格处理"
          description: "识别并处理合并单元格"
          default: true
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # OCR 文字识别
  # ─────────────────────────────────────────────────────────────────────────────
  ocr:
    id: "enhanced.ocr"
    category: "enhanced"

    name: "OCR 文字识别"
    name_en: "OCR Recognition"
    description: "识别扫描件和图片中的文字"
    description_en: "Recognize text from scanned documents and images"
    icon: "document-magnifying-glass"

    use_case: "适用于扫描版 PDF、图片形式的文档"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 4096

    supported_formats:
      - pdf
      - jpg
      - jpeg
      - png
      - tiff
      - bmp

    implementation:
      module: "core.ingestion.nodes.parser.gpu_parser"
      class: "GpuVisionParser"

    config_schema:
      type: object
      properties:
        engine:
          type: string
          title: "OCR 引擎"
          description: "选择 OCR 识别引擎"
          enum: ["paddleocr", "easyocr", "tesseract", "qwen-vl"]
          enum_labels:
            paddleocr: "PaddleOCR (推荐中文)"
            easyocr: "EasyOCR (多语言)"
            tesseract: "Tesseract (开源)"
            qwen-vl: "Qwen-VL (VLM)"
          default: "paddleocr"
          ui_component: "select"

        languages:
          type: array
          title: "识别语言"
          description: "选择需要识别的语言"
          items:
            type: string
          default: ["zh", "en"]
          ui_component: "multi-select"
          available_options:
            - { value: "zh", label: "中文" }
            - { value: "en", label: "English" }
            - { value: "ja", label: "日本語" }
            - { value: "ko", label: "한국어" }

        deskew:
          type: boolean
          title: "自动纠偏"
          description: "自动校正倾斜的文档"
          default: true
          ui_component: "switch"

        denoise:
          type: boolean
          title: "图像去噪"
          description: "处理前进行图像去噪"
          default: false
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # 图像理解
  # ─────────────────────────────────────────────────────────────────────────────
  image_understanding:
    id: "enhanced.image_understanding"
    category: "enhanced"

    name: "图像理解"
    name_en: "Image Understanding"
    description: "为图像、图表生成语义描述"
    description_en: "Generate semantic descriptions for images and charts"
    icon: "photo"

    use_case: "适用于包含图表、照片、插图的文档"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 8192

    # 依赖其他能力
    requires:
      - vlm_provider # 需要配置 VLM 提供商

    implementation:
      module: "core.ingestion.nodes.image_captioner"
      class: "ImageCaptioner"

    config_schema:
      type: object
      properties:
        vlm_provider:
          type: string
          title: "VLM 提供商"
          description: "选择视觉语言模型"
          enum: ["qwen-vl", "gpt-4v", "deepseek-vl"]
          enum_labels:
            qwen-vl: "Qwen-VL (阿里云)"
            gpt-4v: "GPT-4V (OpenAI)"
            deepseek-vl: "DeepSeek-VL"
          default: "qwen-vl"
          ui_component: "select"

        detail_level:
          type: string
          title: "描述详细程度"
          description: "生成描述的详细程度"
          enum: ["brief", "detailed", "comprehensive"]
          enum_labels:
            brief: "简洁 (1-2句)"
            detailed: "详细 (1段)"
            comprehensive: "全面 (多段)"
          default: "detailed"
          ui_component: "select"

        chart_data_extraction:
          type: boolean
          title: "图表数据提取"
          description: "尝试从图表中提取数值数据"
          default: false
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # 语义分块
  # ─────────────────────────────────────────────────────────────────────────────
  semantic_chunking:
    id: "enhanced.semantic_chunking"
    category: "enhanced"

    name: "语义分块"
    name_en: "Semantic Chunking"
    description: "基于语义边界智能切分文档"
    description_en: "Intelligently split documents based on semantic boundaries"
    icon: "puzzle-piece"

    use_case: "适用于需要保持语义完整性的长文档"

    default_enabled: false
    user_configurable: true

    requires:
      - embedding # 依赖嵌入能力

    implementation:
      module: "core.ingestion.nodes.chunker"
      class: "SemanticChunker"

    config_schema:
      type: object
      properties:
        similarity_threshold:
          type: number
          title: "相似度阈值"
          description: "低于此阈值时进行分块"
          minimum: 0.5
          maximum: 0.95
          default: 0.72
          ui_component: "slider"
          ui_step: 0.01

        min_chunk_size:
          type: integer
          title: "最小块大小"
          description: "分块的最小字符数"
          minimum: 64
          maximum: 512
          default: 128
          ui_component: "slider"

  # ─────────────────────────────────────────────────────────────────────────────
  # 重排序
  # ─────────────────────────────────────────────────────────────────────────────
  reranking:
    id: "enhanced.reranking"
    category: "enhanced"

    name: "重排序"
    name_en: "Reranking"
    description: "对检索结果进行精细排序"
    description_en: "Fine-tune the ranking of retrieved results"
    icon: "arrows-up-down"

    use_case: "提升检索结果的相关性排序"

    default_enabled: true
    user_configurable: true

    implementation:
      module: "core.reranker.registry"
      function: "get_reranker"

    config_schema:
      type: object
      properties:
        provider:
          type: string
          title: "重排序模型"
          description: "选择重排序模型提供商"
          enum: ["cross_encoder", "cohere", "http"]
          enum_labels:
            cross_encoder: "CrossEncoder (本地)"
            cohere: "Cohere Rerank"
            http: "自定义 HTTP 服务"
          default: "cross_encoder"
          ui_component: "select"

        model_id:
          type: string
          title: "模型 ID"
          description: "具体模型标识"
          default: "BAAI/bge-reranker-v2-m3"
          ui_component: "text"

        threshold:
          type: number
          title: "过滤阈值"
          description: "低于此分数的结果将被过滤"
          minimum: 0
          maximum: 1
          default: 0.0
          ui_component: "slider"
          ui_step: 0.05

  # ═══════════════════════════════════════════════════════════════════════════════
  # ┌───────────────────────────────────────────────────────────────────────────┐
  # │ 专业能力 (Pro) - 特定场景，专业处理                                         │
  # └───────────────────────────────────────────────────────────────────────────┘
  # ═══════════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────────
  # 视频理解
  # ─────────────────────────────────────────────────────────────────────────────
  video_understanding:
    id: "pro.video_understanding"
    category: "pro"

    name: "视频理解"
    name_en: "Video Understanding"
    description: "视频关键帧提取、语音转文字、内容摘要"
    description_en: "Video keyframe extraction, speech-to-text, content summarization"
    icon: "video-camera"

    use_case: "适用于教学视频、会议录制、培训资料"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 8192

    supported_formats:
      - mp4
      - avi
      - mov
      - mkv
      - webm

    requires:
      - whisper_model
      - vlm_provider

    implementation:
      module: "core.ingestion.processors.video_processor"
      class: "VideoProcessor"

    config_schema:
      type: object
      properties:
        keyframe_interval:
          type: integer
          title: "关键帧间隔(秒)"
          description: "每隔多少秒提取一个关键帧"
          minimum: 1
          maximum: 60
          default: 10
          ui_component: "slider"

        transcription:
          type: boolean
          title: "语音转文字"
          description: "使用 Whisper 进行语音识别"
          default: true
          ui_component: "switch"

        whisper_model:
          type: string
          title: "Whisper 模型"
          description: "语音识别模型大小"
          enum: ["tiny", "base", "small", "medium", "large"]
          default: "base"
          ui_component: "select"
          ui_show_if:
            field: "transcription"
            value: true

        frame_description:
          type: boolean
          title: "帧内容描述"
          description: "使用 VLM 描述关键帧内容"
          default: false
          ui_component: "switch"

        summarize:
          type: boolean
          title: "生成摘要"
          description: "生成视频内容摘要"
          default: false
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # Excel 智能分析
  # ─────────────────────────────────────────────────────────────────────────────
  excel_analysis:
    id: "pro.excel_analysis"
    category: "pro"

    name: "Excel 智能分析"
    name_en: "Excel Analysis"
    description: "Excel 多 Sheet 解析、公式理解、数据关系识别"
    description_en: "Multi-sheet parsing, formula understanding, data relationship detection"
    icon: "table"

    use_case: "适用于复杂的 Excel 数据表格"

    default_enabled: false
    user_configurable: true

    supported_formats:
      - xlsx
      - xls
      - csv

    implementation:
      module: "core.ingestion.processors.excel_processor"
      class: "ExcelProcessor"

    config_schema:
      type: object
      properties:
        parse_all_sheets:
          type: boolean
          title: "解析所有 Sheet"
          description: "解析工作簿中的所有工作表"
          default: true
          ui_component: "switch"

        header_detection:
          type: string
          title: "表头检测"
          description: "如何检测表头行"
          enum: ["auto", "first_row", "none"]
          enum_labels:
            auto: "自动检测"
            first_row: "第一行为表头"
            none: "无表头"
          default: "auto"
          ui_component: "select"

        parse_formulas:
          type: boolean
          title: "公式解析"
          description: "尝试理解和记录公式逻辑"
          default: false
          ui_component: "switch"

        detect_relations:
          type: boolean
          title: "关系检测"
          description: "识别 Sheet 间的数据关系"
          default: false
          ui_component: "switch"

        max_rows:
          type: integer
          title: "最大行数"
          description: "每个 Sheet 处理的最大行数"
          minimum: 100
          maximum: 100000
          default: 10000
          ui_component: "number"

  # ─────────────────────────────────────────────────────────────────────────────
  # 漫画识别
  # ─────────────────────────────────────────────────────────────────────────────
  comic_recognition:
    id: "pro.comic_recognition"
    category: "pro"

    name: "漫画识别"
    name_en: "Comic Recognition"
    description: "漫画分格检测、对话气泡 OCR、场景描述"
    description_en: "Panel detection, speech bubble OCR, scene description"
    icon: "chat-bubble-left-ellipsis"

    use_case: "适用于漫画、连环画、图形小说"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 4096

    supported_formats:
      - jpg
      - jpeg
      - png
      - pdf
      - cbz
      - cbr

    implementation:
      module: "core.ingestion.processors.comic_processor"
      class: "ComicProcessor"

    config_schema:
      type: object
      properties:
        panel_detection:
          type: boolean
          title: "分格检测"
          description: "检测漫画分格边界"
          default: true
          ui_component: "switch"

        bubble_ocr:
          type: boolean
          title: "气泡 OCR"
          description: "识别对话气泡中的文字"
          default: true
          ui_component: "switch"

        scene_description:
          type: boolean
          title: "场景描述"
          description: "使用 VLM 描述每格场景"
          default: false
          ui_component: "switch"

        reading_order:
          type: string
          title: "阅读顺序"
          description: "分格的阅读顺序"
          enum: ["rtl", "ltr"]
          enum_labels:
            rtl: "从右到左 (日漫)"
            ltr: "从左到右 (西方)"
          default: "ltr"
          ui_component: "select"

  # ─────────────────────────────────────────────────────────────────────────────
  # 版面分析
  # ─────────────────────────────────────────────────────────────────────────────
  layout_analysis:
    id: "pro.layout_analysis"
    category: "pro"

    name: "版面分析"
    name_en: "Layout Analysis"
    description: "复杂文档版面结构识别"
    description_en: "Complex document layout structure recognition"
    icon: "view-columns"

    use_case: "适用于多列、浮动元素、复杂排版的文档"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 4096

    implementation:
      module: "core.vision.layout_analyzer"
      class: "LayoutAnalyzer"

    config_schema:
      type: object
      properties:
        model:
          type: string
          title: "分析模型"
          description: "选择版面分析模型"
          enum: ["yolo_doclayout", "layoutlmv3", "dit", "pp_structure"]
          enum_labels:
            yolo_doclayout: "YOLO-DocLayout (快速)"
            layoutlmv3: "LayoutLMv3 (精确)"
            dit: "DiT (高精度)"
            pp_structure: "PP-Structure (中文优化)"
          default: "pp_structure"
          ui_component: "select"

        detect_reading_order:
          type: boolean
          title: "阅读顺序检测"
          description: "识别正确的阅读顺序"
          default: true
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # 垂直领域解读 (Phase 2)
  # ─────────────────────────────────────────────────────────────────────────────
  vertical_domain:
    id: "pro.vertical_domain"
    category: "pro"

    name: "垂直领域解读"
    name_en: "Vertical Domain Interpretation"
    description: "垂直场景的深度解读和叙事能力"
    description_en: "Deep interpretation and narrative capabilities for vertical domains"
    icon: "academic-cap"

    use_case: "适用于需要专业领域知识解读的文档"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 4096

    requires:
      - vlm_provider
      - llm_provider

    implementation:
      module: "core.ingestion.nodes.domain_router"
      class: "DomainRouterNode"

    config_schema:
      type: object
      properties:
        enable_domain_interpretation:
          type: boolean
          title: "启用领域解读"
          description: "在文档处理时启用领域解读"
          default: true
          ui_component: "switch"

        auto_detect_domain:
          type: boolean
          title: "自动检测领域"
          description: "自动检测文档所属领域"
          default: true
          ui_component: "switch"

        fallback_on_error:
          type: boolean
          title: "错误时回退"
          description: "领域解读失败时回退到标准处理"
          default: true
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # 命理解读 (Phase 2)
  # ─────────────────────────────────────────────────────────────────────────────
  metaphysics_interpretation:
    id: "pro.metaphysics_interpretation"
    category: "pro"

    name: "命理解读"
    name_en: "Metaphysics Interpretation"
    description: "八字、五行、神煞等命理元素的专业解读"
    description_en: "Professional interpretation of BaZi, WuXing, ShenSha and other metaphysics elements"
    icon: "moon"

    use_case: "适用于命理分析、八字排盘、五行分析等文档"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 4096

    supported_formats:
      - pdf
      - jpg
      - jpeg
      - png
      - txt

    requires:
      - vlm_provider
      - llm_provider
      - vertical_domain

    implementation:
      module: "core.domains.metaphysics.interpreter"
      class: "MetaphysicsInterpreter"

    config_schema:
      type: object
      properties:
        extract_bazi:
          type: boolean
          title: "提取八字"
          description: "从文档中提取八字信息"
          default: true
          ui_component: "switch"

        extract_wuxing:
          type: boolean
          title: "提取五行"
          description: "分析五行分布"
          default: true
          ui_component: "switch"

        extract_shensha:
          type: boolean
          title: "提取神煞"
          description: "识别神煞信息"
          default: true
          ui_component: "switch"

        generate_narrative:
          type: boolean
          title: "生成叙事"
          description: "生成命理解读叙事文本"
          default: true
          ui_component: "switch"

        detail_level:
          type: string
          title: "详细程度"
          description: "叙事文本的详细程度"
          enum: ["brief", "detailed", "comprehensive"]
          enum_labels:
            brief: "简洁"
            detailed: "详细"
            comprehensive: "全面"
          default: "detailed"
          ui_component: "select"

  # ─────────────────────────────────────────────────────────────────────────────
  # 漫画解读 (Phase 2)
  # ─────────────────────────────────────────────────────────────────────────────
  comic_interpretation:
    id: "pro.comic_interpretation"
    category: "pro"

    name: "漫画解读"
    name_en: "Comic Interpretation"
    description: "漫画分格检测、对话提取、场景描述、故事叙事"
    description_en: "Panel detection, dialogue extraction, scene description, story narrative"
    icon: "chat-bubble-bottom-center-text"

    use_case: "适用于四格漫画、连环画、图形小说的深度解读"

    default_enabled: false
    user_configurable: true

    requires_gpu: true
    gpu_memory_mb: 8192

    supported_formats:
      - jpg
      - jpeg
      - png
      - pdf
      - cbz
      - cbr

    requires:
      - vlm_provider
      - vertical_domain

    implementation:
      module: "core.domains.comic.interpreter"
      class: "ComicInterpreter"

    config_schema:
      type: object
      properties:
        panel_detection:
          type: boolean
          title: "分格检测"
          description: "检测漫画分格边界"
          default: true
          ui_component: "switch"

        dialogue_extraction:
          type: boolean
          title: "对话提取"
          description: "使用 OCR 提取对话气泡中的文字"
          default: true
          ui_component: "switch"

        scene_description:
          type: boolean
          title: "场景描述"
          description: "使用 VLM 描述每格场景内容"
          default: true
          ui_component: "switch"

        art_style_analysis:
          type: boolean
          title: "艺术风格分析"
          description: "分析漫画的艺术风格特征"
          default: false
          ui_component: "switch"

        reading_order:
          type: string
          title: "阅读顺序"
          description: "分格的阅读顺序"
          enum: ["rtl", "ltr"]
          enum_labels:
            rtl: "从右到左 (日漫)"
            ltr: "从左到右 (西方)"
          default: "ltr"
          ui_component: "select"

        generate_narrative:
          type: boolean
          title: "生成叙事"
          description: "生成连贯的故事叙事"
          default: true
          ui_component: "switch"

        detail_level:
          type: string
          title: "详细程度"
          description: "叙事文本的详细程度"
          enum: ["brief", "detailed", "comprehensive"]
          enum_labels:
            brief: "简洁"
            detailed: "详细"
            comprehensive: "全面"
          default: "detailed"
          ui_component: "select"

  # ═══════════════════════════════════════════════════════════════════════════════
  # ┌───────────────────────────────────────────────────────────────────────────┐
  # │ 高级能力 (Advanced) - 知识增强，深度分析                                    │
  # └───────────────────────────────────────────────────────────────────────────┘
  # ═══════════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────────
  # RAPTOR 层级摘要
  # ─────────────────────────────────────────────────────────────────────────────
  raptor:
    id: "advanced.raptor"
    category: "advanced"

    name: "RAPTOR 层级摘要"
    name_en: "RAPTOR Hierarchical Summary"
    description: "递归摘要聚类，构建多层知识树"
    description_en: "Recursive summarization clustering, build multi-level knowledge tree"
    icon: "rectangle-stack"

    use_case: "适用于需要多层级理解的大型知识库"

    default_enabled: false
    user_configurable: true

    requires:
      - llm_provider
      - embedding

    implementation:
      module: "core.algorithms.raptor_deep"
      function: "create_raptor_deep_graph"

    config_schema:
      type: object
      properties:
        scope:
          type: string
          title: "作用范围"
          description: "RAPTOR 的构建范围"
          enum: ["whole_kb", "per_document"]
          enum_labels:
            whole_kb: "整个知识库"
            per_document: "按文档构建"
          default: "whole_kb"
          ui_component: "select"

        max_clusters:
          type: integer
          title: "最大聚类数"
          description: "每层最大聚类数量"
          minimum: 8
          maximum: 128
          default: 64
          ui_component: "slider"

        levels:
          type: integer
          title: "层级数"
          description: "知识树的层次深度"
          minimum: 1
          maximum: 5
          default: 3
          ui_component: "slider"

        summary_max_tokens:
          type: integer
          title: "摘要长度"
          description: "每个摘要的最大 Token 数"
          minimum: 64
          maximum: 512
          default: 256
          ui_component: "slider"

  # ─────────────────────────────────────────────────────────────────────────────
  # 知识图谱 GraphRAG
  # ─────────────────────────────────────────────────────────────────────────────
  graphrag:
    id: "advanced.graphrag"
    category: "advanced"

    name: "知识图谱"
    name_en: "Knowledge Graph (GraphRAG)"
    description: "实体关系抽取，社区检测，图谱问答"
    description_en: "Entity-relation extraction, community detection, graph-based QA"
    icon: "share"

    use_case: "适用于需要理解实体关系的场景"

    default_enabled: false
    user_configurable: true

    requires:
      - llm_provider

    implementation:
      module: "core.algorithms.graphrag_deep"
      function: "create_graphrag_deep_graph"

    config_schema:
      type: object
      properties:
        entity_types:
          type: array
          title: "实体类型"
          description: "需要抽取的实体类型"
          items:
            type: string
          default: ["person", "organization", "geo", "event"]
          ui_component: "multi-select"
          available_options:
            - { value: "person", label: "人物" }
            - { value: "organization", label: "组织" }
            - { value: "geo", label: "地理位置" }
            - { value: "event", label: "事件" }
            - { value: "product", label: "产品" }
            - { value: "concept", label: "概念" }

        community_detection:
          type: boolean
          title: "社区检测"
          description: "使用 Louvain 算法检测实体社区"
          default: true
          ui_component: "switch"

        community_summary:
          type: boolean
          title: "社区摘要"
          description: "为每个社区生成描述摘要"
          default: false
          ui_component: "switch"
          ui_show_if:
            field: "community_detection"
            value: true

        max_concurrency:
          type: integer
          title: "并发度"
          description: "LLM 抽取的并发请求数"
          minimum: 1
          maximum: 16
          default: 8
          ui_component: "slider"

  # ─────────────────────────────────────────────────────────────────────────────
  # 多模态融合检索
  # ─────────────────────────────────────────────────────────────────────────────
  multimodal_retrieval:
    id: "advanced.multimodal_retrieval"
    category: "advanced"

    name: "多模态融合检索"
    name_en: "Multimodal Retrieval"
    description: "文本+图像+表格联合检索"
    description_en: "Joint retrieval of text, images, and tables"
    icon: "rectangle-group"

    use_case: "适用于需要跨模态搜索的知识库"

    default_enabled: false
    user_configurable: true

    requires:
      - embedding
      - image_understanding

    implementation:
      module: "core.retrieval.multimodal"
      class: "MultimodalRetriever"

    config_schema:
      type: object
      properties:
        text_weight:
          type: number
          title: "文本权重"
          description: "文本检索结果的权重"
          minimum: 0
          maximum: 1
          default: 0.5
          ui_component: "slider"
          ui_step: 0.1

        image_weight:
          type: number
          title: "图像权重"
          description: "图像检索结果的权重"
          minimum: 0
          maximum: 1
          default: 0.3
          ui_component: "slider"
          ui_step: 0.1

        table_weight:
          type: number
          title: "表格权重"
          description: "表格检索结果的权重"
          minimum: 0
          maximum: 1
          default: 0.2
          ui_component: "slider"
          ui_step: 0.1

  # ─────────────────────────────────────────────────────────────────────────────
  # 幻觉检测
  # ─────────────────────────────────────────────────────────────────────────────
  hallucination_detection:
    id: "advanced.hallucination_detection"
    category: "advanced"

    name: "幻觉检测"
    name_en: "Hallucination Detection"
    description: "检测回答中的无依据陈述"
    description_en: "Detect unsupported claims in generated answers"
    icon: "exclamation-triangle"

    use_case: "提升回答的可靠性和可信度"

    default_enabled: false
    user_configurable: true

    requires:
      - llm_provider

    implementation:
      module: "core.graph"
      class: "HallucinationChecker"

    config_schema:
      type: object
      properties:
        threshold:
          type: number
          title: "检测阈值"
          description: "高于此分数触发警告"
          minimum: 0.3
          maximum: 0.9
          default: 0.5
          ui_component: "slider"
          ui_step: 0.1

        add_warning:
          type: boolean
          title: "添加警告"
          description: "检测到幻觉时在回答中添加警告"
          default: true
          ui_component: "switch"

  # ─────────────────────────────────────────────────────────────────────────────
  # 网络搜索增强
  # ─────────────────────────────────────────────────────────────────────────────
  web_search:
    id: "advanced.web_search"
    category: "advanced"

    name: "网络搜索增强"
    name_en: "Web Search Enhancement"
    description: "结合实时网络搜索补充知识库"
    description_en: "Augment KB with real-time web search"
    icon: "globe-alt"

    use_case: "适用于需要最新信息的查询"

    default_enabled: false
    user_configurable: true

    implementation:
      module: "core.tools.web_search_registry"
      function: "get_web_search_provider"

    config_schema:
      type: object
      properties:
        provider:
          type: string
          title: "搜索提供商"
          description: "选择网络搜索服务"
          enum: ["tavily", "serper", "bocha", "duckduckgo"]
          enum_labels:
            tavily: "Tavily (推荐)"
            serper: "Serper"
            bocha: "博查"
            duckduckgo: "DuckDuckGo (免费)"
          default: "tavily"
          ui_component: "select"

        max_results:
          type: integer
          title: "最大结果数"
          description: "搜索返回的最大结果数"
          minimum: 1
          maximum: 10
          default: 5
          ui_component: "slider"

        auto_trigger:
          type: boolean
          title: "自动触发"
          description: "根据查询意图自动触发网络搜索"
          default: false
          ui_component: "switch"

# ═══════════════════════════════════════════════════════════════════════════════
# 能力依赖说明
# ═══════════════════════════════════════════════════════════════════════════════
dependencies:
  llm_provider:
    description: "需要配置 LLM 提供商"
    check_env: ["OPENAI_API_KEY", "DASHSCOPE_API_KEY", "DEEPSEEK_API_KEY"]
    settings_path: "providers.llm"

  vlm_provider:
    description: "需要配置 VLM 提供商"
    check_env: ["DASHSCOPE_API_KEY", "OPENAI_API_KEY", "DEEPSEEK_API_KEY"]
    settings_path: "providers.vlm"

  embedding:
    description: "需要配置嵌入模型"
    capability_id: "basic.embedding"

  whisper_model:
    description: "需要安装 Whisper 模型"
    check_package: "openai-whisper"
